name: Antalya etkinliklerini güncelle
on:
  schedule:
    - cron: '0 6,12 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'antalya.py'
      - '.github/workflows/antalya.yml'
permissions:
  contents: write
concurrency:
  group: antalya-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright/python:v1.55.0-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - run: python antalya.py
      - name: Etkinlik listesini yayımla
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add etkinlikler.json
          if ! git diff --cached --quiet; then
            git commit -m 'Antalya etkinliklerini güncelle'
            git push
          fi
